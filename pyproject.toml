[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipe-dev-agent"
version = "0.1.0"
description = "Ephemeral developer agent — one task, then handoff. ReAct loop with context compaction."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hans", email = "hans@pipe.dev"},
]
keywords = ["agent", "llm", "react", "developer", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.0.50",
]

[project.optional-dependencies]
playwright = [
    "langchain-community[playwright]>=0.2.0",
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/hans/pipe-dev-agent"
Repository = "https://github.com/hans/pipe-dev-agent"
Issues = "https://github.com/hans/pipe-dev-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pipe_dev_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
